{% extends 'pagina.html' %}

{% block contenido %}
	<div class='container-fluid'>
	</div>
	<!-- Placeholder for Map -->
	<div class='row'>
		<center>
			<div class='map-container'>
				<div id='map' data-type='{{ tipo }}'></div>
			</div>
		</center>
	</div>
	<script src='static/js/mapa.js'></script>
	{% if maps_api_key %}
	<script src="https://maps.googleapis.com/maps/api/js?key={{ maps_api_key|urlencode }}&libraries=places&callback=initMap" async></script>
	{% else %}<p role="status">Map unavailable: configure GOOGLE_MAPS_API_KEY to enable nearby search.</p>{% endif %}
{% endblock %}
